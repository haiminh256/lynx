[package]
name = "lynx"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "sync"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
sha2 = "0.11.0"
hex = "0.4.3"
flate2 = "1.1.10"
tar = "0.4.46"
dirs = "7.0.0"
which = "8.0.6"
thiserror = "2.0.20"
anyhow = "1.0.104"
futures = "0.3.34"
parking_lot = "0.12.5"
walkdir = "2.5.0"